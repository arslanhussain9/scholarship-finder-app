<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Scholarship Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i data-lucide="graduation-cap"></i> Scholarship Finder
    </a>
    <div class="nav-links" id="nav-links">
      <!-- Injected by JS -->
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <h2>Create an Account</h2>
      <div id="register-alert" class="form-alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Create a password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required placeholder="Confirm your password">
        </div>
        <button type="submit" class="btn-primary form-btn">Register</button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 500;">Login here</a>
      </p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
