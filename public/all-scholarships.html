<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Scholarships | Scholarship Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i data-lucide="graduation-cap"></i> Scholarship Finder
    </a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="container">
    <div class="results-header">
      <h2>Browse All Scholarships</h2>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Explore our comprehensive database of Central and State government schemes.</p>
    </div>

    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
      <button class="btn-primary" id="tab-all" onclick="filterScholarships('All')">All (<span id="count-all">0</span>)</button>
      <button class="btn-secondary" id="tab-central" onclick="filterScholarships('Central')">Central (<span id="count-central">0</span>)</button>
      <button class="btn-secondary" id="tab-state" onclick="filterScholarships('State')">State (<span id="count-state">0</span>)</button>
    </div>

    <div id="scholarships-container" class="matches-grid">
      <!-- Injected by JS -->
    </div>

  </main>

  <script src="app.js"></script>
  <script>
    lucide.createIcons();
    setupNav(); // don't enforce auth, let it be public

    let allData = [];

    async function loadAllScholarships() {
      try {
        const res = await fetch('/api/scholarships');
        if (res.ok) {
          allData = await res.json();
          document.getElementById('count-all').textContent = allData.length;
          document.getElementById('count-central').textContent = allData.filter(s => s.type === 'Central').length;
          document.getElementById('count-state').textContent = allData.filter(s => s.type === 'State').length;
          
          renderScholarships(allData);
        }
      } catch (err) {
        console.error('Failed to load scholarships', err);
      }
    }

    function renderScholarships(list) {
      const container = document.getElementById('scholarships-container');
      if (list.length === 0) {
        container.innerHTML = '<p>No scholarships found.</p>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="scholarship-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span class="card-type ${item.type === 'Central' ? 'type-central' : 'type-state'}">${item.type}</span>
            <span style="font-size: 0.8rem; color: var(--text-muted);">${item.states.includes('All') ? 'Pan-India' : item.states.join(', ')}</span>
          </div>
          <h3 class="card-title">${item.name}</h3>
          
          <div style="margin: 1rem 0; padding: 0.5rem; background: var(--bg); border-radius: 6px; font-size: 0.85rem; color: var(--text-muted);">
            <i data-lucide="info" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 4px;"></i>
            ${item.description || 'Government assistance program'}
          </div>

          <p class="card-meta">
            <strong>Target:</strong> ${item.scholarship_level}<br>
            <strong>Grades:</strong> ${item.eligible_classes.join(', ')}<br>
            <strong>Benefits:</strong> ${item.benefits || 'Financial Support'}<br>
            <strong>Deadline:</strong> ${new Date(item.deadline).toLocaleDateString()}<br>
          </p>
          <a href="${item.apply_link}" target="_blank" class="btn-primary" style="text-align: center; text-decoration: none; margin-top: auto;">View Official Portal</a>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function filterScholarships(type) {
      // Update UI tabs
      document.getElementById('tab-all').className = type === 'All' ? 'btn-primary' : 'btn-secondary';
      document.getElementById('tab-central').className = type === 'Central' ? 'btn-primary' : 'btn-secondary';
      document.getElementById('tab-state').className = type === 'State' ? 'btn-primary' : 'btn-secondary';

      if (type === 'All') {
        renderScholarships(allData);
      } else {
        renderScholarships(allData.filter(s => s.type === type));
      }
    }

    loadAllScholarships();
  </script>
</body>
</html>
