<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Scholarship Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i data-lucide="graduation-cap"></i> Scholarship Finder Admin
    </a>
    <div class="nav-links" id="nav-links">
      <!-- Injected by JS -->
    </div>
  </nav>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>Manage Scholarships</h2>
      <div style="display: flex; gap: 1rem;">
        <button class="btn-secondary" onclick="runAPIFetch()" id="run-fetch-btn">
          <i data-lucide="refresh-cw" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> 
          Fetch Latest Scholarships
        </button>
        <button class="btn-primary" onclick="document.getElementById('add-modal').classList.remove('hidden')">
          <i data-lucide="plus" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> 
          Add New Scholarship
        </button>
      </div>
    </div>

    <div style="background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="background: #F3F4F6; border-bottom: 1px solid var(--border);">
            <th style="padding: 1rem; font-weight: 600; color: var(--text-muted);">Name</th>
            <th style="padding: 1rem; font-weight: 600; color: var(--text-muted);">Type</th>
            <th style="padding: 1rem; font-weight: 600; color: var(--text-muted);">Status</th>
            <th style="padding: 1rem; font-weight: 600; color: var(--text-muted);">Deadline</th>
            <th style="padding: 1rem; font-weight: 600; color: var(--text-muted);">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-scholarships">
          <tr><td colspan="4" style="padding: 1rem; text-align: center;">Loading scholarships...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
      <div style="background: var(--card-bg); padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
        <h3 style="margin-bottom: 1.5rem;">Edit Scholarship</h3>
        <form id="edit-form">
          <input type="hidden" id="e-id">
          <div class="form-group"><label>Name</label><input type="text" id="e-name" required></div>
          <div class="form-group"><label>Type</label>
            <select id="e-type"><option value="Central">Central</option><option value="State">State</option><option value="Private">Private</option></select>
          </div>
          <div class="form-group"><label>Level</label><input type="text" id="e-level" required></div>
          <div class="form-group"><label>Income Limit</label><input type="number" id="e-income" required></div>
          <div class="form-group"><label>State (Use 'All' for Central)</label><input type="text" id="e-states" required></div>
          <div class="form-group"><label>Description</label><input type="text" id="e-desc" required></div>
          <div class="form-group"><label>Benefits</label><input type="text" id="e-benefits" required></div>
          <div class="form-group"><label>Deadline</label><input type="date" id="e-deadline" required></div>
          <div class="form-group"><label>Apply Link</label><input type="text" id="e-link" required></div>
          
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="button" class="btn-secondary form-btn" onclick="document.getElementById('edit-modal').classList.add('hidden')">Cancel</button>
            <button type="submit" class="btn-primary form-btn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add Modal -->
    <div id="add-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
      <div style="background: var(--card-bg); padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
        <h3 style="margin-bottom: 1.5rem;">Add Scholarship</h3>
        <form id="add-form">
          <div class="form-group"><label>Name</label><input type="text" id="a-name" required></div>
          <div class="form-group"><label>Type</label>
            <select id="a-type"><option value="Central">Central</option><option value="State">State</option><option value="Private">Private</option></select>
          </div>
          <div class="form-group"><label>Level</label><input type="text" id="a-level" required></div>
          <div class="form-group"><label>Income Limit</label><input type="number" id="a-income" required></div>
          <div class="form-group"><label>State (Use 'All' for Central)</label><input type="text" id="a-states" required></div>
          <div class="form-group"><label>Description</label><input type="text" id="a-desc" required></div>
          <div class="form-group"><label>Benefits</label><input type="text" id="a-benefits" required></div>
          <div class="form-group"><label>Deadline</label><input type="date" id="a-deadline" required></div>
          <div class="form-group"><label>Apply Link</label><input type="text" id="a-link" required></div>
          
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="button" class="btn-secondary form-btn" onclick="document.getElementById('add-modal').classList.add('hidden')">Cancel</button>
            <button type="submit" class="btn-primary form-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    lucide.createIcons();

    let allScholarships = [];

    // Custom auth check for admin page
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role !== 'admin') {
      document.body.innerHTML = '<div style="text-align:center; padding: 4rem;"><h2>Access Denied</h2><p>Admin privileges required.</p><a href="/">Go Home</a></div>';
    } else {
      loadAdminScholarships();
    }

    async function loadAdminScholarships() {
      try {
        const res = await fetch('/api/scholarships/admin/all', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (!res.ok) {
          const errData = await res.json();
          document.getElementById('admin-scholarships').innerHTML = `<tr><td colspan="5" style="padding: 1rem; text-align: center; color: var(--danger);">Failed to load: ${errData.message || 'Unauthorized Access'}</td></tr>`;
          return;
        }

        const data = await res.json();
        allScholarships = data;
        
        const tbody = document.getElementById('admin-scholarships');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding: 1rem; text-align: center;">No scholarships found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(sch => `
          <tr style="border-bottom: 1px solid var(--border); ${sch.status === 'pending' ? 'background-color: #fefce8;' : ''}">
            <td style="padding: 1rem;">
              <strong>${sch.name}</strong>
              <div style="font-size: 0.8rem; color: #6B7280; margin-top: 0.25rem;">Source: ${sch.source || 'manual'}</div>
            </td>
            <td style="padding: 1rem;"><span class="card-type ${sch.type === 'Central' ? 'type-central' : sch.type === 'State' ? 'type-state' : 'type-private'}">${sch.type}</span></td>
            <td style="padding: 1rem;">
              <span style="padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.875rem; 
                ${sch.status === 'approved' ? 'background: #D1FAE5; color: #065F46;' : 
                  sch.status === 'rejected' ? 'background: #FEE2E2; color: #991B1B;' : 
                  'background: #FEF3C7; color: #92400E;'}">
                ${sch.status ? sch.status.toUpperCase() : 'APPROVED'}
              </span>
            </td>
            <td style="padding: 1rem;">${sch.deadline ? new Date(sch.deadline).toLocaleDateString() : 'N/A'}</td>
            <td style="padding: 1rem;">
              <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                ${sch.status === 'pending' ? `
                  <button onclick="updateStatus('${sch._id}', 'approved')" style="background: none; border: none; color: #059669; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                    <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i> Approve
                  </button>
                  <button onclick="updateStatus('${sch._id}', 'rejected')" style="background: none; border: none; color: #DC2626; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                    <i data-lucide="x-circle" style="width: 16px; height: 16px;"></i> Reject
                  </button>
                ` : ''}
                <button onclick="openEditModal('${sch._id}')" style="background: none; border: none; color: var(--primary); cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                  <i data-lucide="edit-2" style="width: 16px; height: 16px;"></i> Edit
                </button>
                <button onclick="deleteSch('${sch._id}')" style="background: none; border: none; color: var(--danger); cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                  <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i> Delete
                </button>
              </div>
            </td>
          </tr>
        `).join('');
        lucide.createIcons();
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('a-name').value,
        type: document.getElementById('a-type').value,
        scholarship_level: document.getElementById('a-level').value,
        income_limit: parseInt(document.getElementById('a-income').value),
        states: [document.getElementById('a-states').value],
        description: document.getElementById('a-desc').value,
        benefits: document.getElementById('a-benefits').value,
        deadline: document.getElementById('a-deadline').value,
        apply_link: document.getElementById('a-link').value,
        eligible_classes: ['UG', 'PG', '11th', '12th'],
        eligible_categories: ['All', 'SC', 'ST', 'OBC'],
        eligible_gender: 'All',
        documents_required: ['Income Certificate', 'Aadhar Card']
      };

      try {
        const res = await fetch('/api/scholarships', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('add-modal').classList.add('hidden');
          loadAdminScholarships();
          e.target.reset();
        } else {
          alert('Failed to add scholarship');
        }
      } catch (err) {
        console.error(err);
      }
    });

    function openEditModal(id) {
      const sch = allScholarships.find(s => s._id === id);
      if (!sch) return;
      
      document.getElementById('e-id').value = sch._id;
      document.getElementById('e-name').value = sch.name;
      document.getElementById('e-type').value = sch.type;
      document.getElementById('e-level').value = sch.scholarship_level;
      document.getElementById('e-income').value = sch.income_limit;
      document.getElementById('e-states').value = sch.states.join(', ');
      document.getElementById('e-desc').value = sch.description;
      document.getElementById('e-benefits').value = sch.benefits;
      document.getElementById('e-deadline').value = sch.deadline ? sch.deadline.split('T')[0] : '';
      document.getElementById('e-link').value = sch.apply_link;
      
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('e-id').value;
      const payload = {
        name: document.getElementById('e-name').value,
        type: document.getElementById('e-type').value,
        scholarship_level: document.getElementById('e-level').value,
        income_limit: parseInt(document.getElementById('e-income').value),
        states: [document.getElementById('e-states').value],
        description: document.getElementById('e-desc').value,
        benefits: document.getElementById('e-benefits').value,
        deadline: document.getElementById('e-deadline').value,
        apply_link: document.getElementById('e-link').value
      };

      try {
        const res = await fetch(`/api/scholarships/${id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('edit-modal').classList.add('hidden');
          loadAdminScholarships();
        } else {
          alert('Failed to update scholarship');
        }
      } catch (err) {
        console.error(err);
      }
    });

    async function updateStatus(id, newStatus) {
      if(!confirm(`Are you sure you want to ${newStatus} this scholarship?`)) return;
      try {
        const res = await fetch(`/api/scholarships/${id}/status`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token') 
          },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          loadAdminScholarships();
        } else {
          alert('Failed to update status');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function runAPIFetch() {
      const btn = document.getElementById('run-fetch-btn');
      btn.innerHTML = '<i data-lucide="loader" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> Fetching AI Data...';
      btn.disabled = true;
      try {
        // Pre-check: confirm fetch route is loaded (needs server restart after code changes)
        const ping = await fetch('/api/fetch/ping').catch(() => null);
        if (!ping || !ping.ok) {
          alert('❌ API pull route not responding.\n\nYou must RESTART your server:\n  1. Press Ctrl+C in your terminal\n  2. Run: node server.js\n\nThen try again.');
          return;
        }

        const res = await fetch('/api/fetch/run', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });

        const data = await res.json();

        if (!res.ok) {
          alert('❌ Error ' + res.status + ':\n' + (data.message || 'Unknown error — check server console'));
          return;
        }

        const sourceLines = (data.sources || [])
          .map(s => '  • ' + s.name + ': ' + s.found + ' found' + (s.error ? ' ❌ (' + s.error + ')' : ' ✓'))
          .join('\n');

        alert([
          '✅ ' + (data.summary || (data.newAdded + ' new scholarships added to pending queue')),
          '',
          'Sources:',
          sourceLines || '  (no source detail)',
          '',
          'Total valid: ' + (data.totalValid ?? '?'),
          'New added:   ' + (data.newAdded ?? '?'),
          'Duplicates:  ' + (data.duplicatesSkipped ?? '?')
        ].join('\n'));

        if ((data.newAdded ?? 0) > 0) loadAdminScholarships();

      } catch (err) {
        console.error(err);
        alert('❌ Network error:\n' + err.message + '\n\nMake sure your server is running.');
      } finally {
        btn.innerHTML = '<i data-lucide="refresh-cw" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> Fetch Latest Scholarships';
        btn.disabled = false;
        lucide.createIcons();
      }
    }


    async function deleteSch(id) {
      if(!confirm('Are you sure you want to delete this scholarship?')) return;
      
      try {
        const res = await fetch(`/api/scholarships/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });

        if (res.ok) {
          loadAdminScholarships();
        } else {
          alert('Failed to delete');
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
